

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetPulse - Internet Speed Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>NetPulse</h1>
    <p>Test your internet connection</p>

    <button id="startBtn">Start Test</button>

    <p id="status">Ready to test</p>
	<div class="progress-container">
	  <div id="progressBar"></div>
	</div>
	<p id="progressText">0%</p>
    <section class="results">
      <div>
        <h2>Ping</h2>
        <p id="ping">-- ms</p>
      </div>

      <div>
        <h2>Download</h2>
        <p id="download">-- Mbps</p>
      </div>

      <div>
        <h2>Upload</h2>
        <p id="upload">-- Mbps</p>
      </div>
    </section>
   	<p id="downloadUsage">Downloaded: 0.00 MB</p>
	<p id="uploadUsage">Uploaded: 0.00 MB</p>
	<p id="testDuration">Test duration: -- seconds</p>
  </main>
</body>
</html>
